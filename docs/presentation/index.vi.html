<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE Smart Queue Assistant — Bài Thuyết Trình (Tiếng Việt)</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="deck-container">
    <!-- Viewport for dynamic slide rendering -->
    <div id="slide-viewport"></div>

    <!-- Progress Bar -->
    <div id="progress-bar"></div>

    <!-- Fixed Controls Overlay -->
    <div id="deck-controls">
      <a href="../../index.html" class="control-btn" id="dashboard-btn" style="text-decoration:none; width:auto; padding:0 10px; font-size:12px; font-weight:700;" title="Trở về Dashboard Hub">🏠 Dashboard</a>
      <button class="control-btn" id="prev-btn" title="Slide trước (←)">←</button>
      <span class="slide-counter" id="slide-counter">01 / 07</span>
      <button class="control-btn" id="next-btn" title="Slide tiếp (→)">→</button>
      <button class="control-btn" id="notes-btn" title="Mở Speaker Notes (P)">📝</button>
      <button class="control-btn" id="fullscreen-btn" title="Toàn màn hình (F)">⛶</button>
      <button class="control-btn" id="lang-btn" style="width:auto; padding:0 8px; font-size:13px; font-weight:700;" title="Chuyển ngôn ngữ">🇯🇵 JP</button>
    </div>

    <!-- Presenter Notes Drawer -->
    <div id="presenter-notes-drawer">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="notes-drawer-title">Speaker Notes</h3>
        <button id="close-notes-btn" style="background: none; border: none; color: white; cursor: pointer; font-size: 18px;">✕</button>
      </div>
      <div id="presenter-notes-content"></div>
    </div>
  </div>

  <!-- Language Configuration Files -->
  <script src="./slides.ja.js"></script>
  <script src="./slides.vi.js"></script>
  <!-- Presentation Engine Script -->
  <script src="./script.js"></script>
</body>
</html>
